# Publikacja strony aplikacji CURL na GitHub Pages (polecenie TS 19.11.2026: karty charakterystyki tylko po zalogowaniu,
# testy i README poza stroną). Publikowane są wszystkie pliki poza .git, .github, tests/ i README.md; przed publikacją
# sprawdzenie (.github/skrypty/sprawdz_publikacje.py): żadnego dowiązania symbolicznego, jawnego PDF ani pliku spoza listy
# dozwolonych (ta sama lista co W-07 w teście wydania).
# Wymaga Settings → Pages → Source: „GitHub Actions”.
# Po wdrożeniu (job weryfikacja_www, needs: publikacja – także przy ręcznym uruchomieniu) sprawdzenie strony na żywo:
# każda z kart pelny/sds/*.bin zaszyfrowana = 200, jej jawna wersja w sds/ i pelny/sds/ = 404, pliki wewnętrzne = 404,
# oraz test zachowania strony w przeglądarce (uwagi przeglądu PR #32, 20.11.2026: bez „sleep 90”, bez „head -1”).
name: Publikacja strony
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publikacja:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.wdrozenie.outputs.page_url }}
    outputs:
      page_url: ${{ steps.wdrozenie.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Brak dowiązań symbolicznych w repozytorium (publikacja rozwija dowiązania; uwaga przeglądu #31)
        run: |
          d=$(find . -path ./.git -prune -o -type l -print)
          if [ -n "$d" ]; then echo "Dowiązania symboliczne – publikacja zatrzymana:"; echo "$d"; exit 1; fi
          echo "OK: brak dowiązań symbolicznych"
      - name: Test negatywny sprawdzenia publikacji (dowiązania i jawny PDF muszą być wykryte)
        run: python3 .github/skrypty/sprawdz_publikacje.py --negatywny
      - name: Złożenie plików do publikacji
        run: |
          mkdir _site
          rsync -a --no-links --exclude .git --exclude .github --exclude tests --exclude README.md --exclude _site ./ _site/
      - name: Sprawdzenie – bez dowiązań, brak jawnych PDF i plików spoza listy dozwolonych
        run: python3 .github/skrypty/sprawdz_publikacje.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: wdrozenie
        uses: actions/deploy-pages@v4

  weryfikacja_www:
    name: Weryfikacja strony na żywo po wdrożeniu
    needs: publikacja
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      URL: ${{ needs.publikacja.outputs.page_url || 'https://tomasz1961.github.io/kurs-bhp-curl/' }}
    steps:
      - name: Lista zaszyfrowanych kart z wdrożonego commita
        uses: actions/checkout@v4
      - name: Test negatywny sprawdzenia (jawna karta inna niż pierwsza, w sds/ i pelny/sds/, MUSI dać błąd)
        run: bash .github/skrypty/sprawdz_strone_na_zywo.sh --negatywny .
      - name: Strona na żywo bez plików wewnętrznych i jawnych kart (wszystkie karty, obie dawne ścieżki)
        run: bash .github/skrypty/sprawdz_strone_na_zywo.sh "$URL" .
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Test zachowania strony na żywo w przeglądarce
        run: node tests/test_www.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wynik-testu-www-na-zywo
          path: |
            wynik_testu.json
            wynik_*.pdf
