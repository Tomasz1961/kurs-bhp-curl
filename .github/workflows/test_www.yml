name: Test strony www kursu
on:
  push:
    branches: [main, 'odbior-*']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Czekaj na wdrożenie Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: sleep 90
      - name: Lokalny serwer z plikami gałęzi (prośba o scalenie – test przed scaleniem, nie strona na żywo)
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 8000 > /dev/null 2>&1 &
          sleep 2
          echo "URL=http://localhost:8000/" >> "$GITHUB_ENV"
      - name: Test strony (push – strona na żywo; prośba o scalenie – pliki gałęzi z lokalnego serwera)
        run: node tests/test_www.js
      - name: Test negatywny (strona publiczna z dopisanym testem, polem PIN i zapisem – test MUSI dać BŁĄD)
        run: |
          if TRYB=negatywny node tests/test_www.js > neg.log; then echo "Test nie wykrył włączonego zapisu"; cat neg.log; exit 1; fi
          grep -q '"WYNIK": "BŁĄD"' wynik_testu_negatywnego.json && grep -q 'TEST_NEGATYWNY' wynik_testu_negatywnego.json && echo "test negatywny strony: wykryto włączony zapis (POST zablokowany)"
      - name: Kontrola odnośników (pliki kart charakterystyki i inne odnośniki względne; audyt 15.11.2026 C-04)
        run: python3 tests/test_negatywny_odnosniki.py && python3 tests/sprawdz_odnosniki.py
      - name: Kontrola języka (ten sam sprawdzacz i ta sama lista co lokalnie; dec. 128)
        run: node tests/render_zakladki.js "$PWD/index.html" teksty_www.json && python3 tests/sprawdz_jezyk.py teksty_www.json tests/jezyk_lista.json --pokaz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wynik-testu-www
          path: |
            wynik_testu.json
            wynik_testu_negatywnego.json
            teksty_www.json
            wynik_*.pdf
