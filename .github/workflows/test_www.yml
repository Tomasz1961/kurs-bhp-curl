name: Test strony www kursu
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Czekaj na wdrożenie Pages
        run: sleep 90
      - run: node tests/test_www.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wynik-testu-www
          path: |
            wynik_testu.json
            wynik_*.pdf
